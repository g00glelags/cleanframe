<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- Accent Blue Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>

    <!-- Selection Highlight Gradient -->
    <linearGradient id="selectionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#87CFFF"/>
      <stop offset="100%" stop-color="#B8E6FF"/>
    </linearGradient>

    <!-- Window Surface Gradient -->
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Soft Drop Shadow for Icon Base -->
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <!-- Frame Shadow -->
    <filter id="frameShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Squircle / App Icon Base -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#softShadow)" stroke="#E2E8F0" stroke-width="3"/>

  <!-- The "CleanFrame" Window Graphic -->
  <g filter="url(#frameShadow)">
    <!-- Outer Window Card -->
    <rect x="88" y="96" width="336" height="320" rx="28" fill="url(#windowGrad)" stroke="#CBD5E1" stroke-width="2.5"/>

    <!-- Headerbar Divider -->
    <path d="M 88,168 L 424,168" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Window Controls (CleanFrame Hallmark: Close dot, Square Maximize, Dash Minimize) -->
    <!-- Close -->
    <circle cx="126" cy="132" r="7.5" fill="#EF4444" opacity="0.85"/>
    
    <!-- Minimize -->
    <circle cx="152" cy="132" r="7.5" fill="#F59E0B" opacity="0.85"/>

    <!-- Maximize (CleanFrame signature square) -->
    <circle cx="178" cy="132" r="7.5" fill="#10B981" opacity="0.85"/>
  </g>

  <!-- Central Graphic: CleanFrame Geometry / Modern Interlocking Monogram -->
  <g transform="translate(132, 200)">
    <!-- Stylized "C" Frame Element -->
    <path d="M 170,24 
             C 140,4 90,4 60,28 
             C 24,56 24,116 60,144 
             C 90,168 140,168 170,148" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="24" 
          stroke-linecap="round"/>

    <!-- Stylized "F" Frame Beam & Selection Bar -->
    <!-- Vertical stem -->
    <line x1="120" y1="44" x2="120" y2="136" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Top Horizontal bar -->
    <line x1="120" y1="44" x2="188" y2="44" stroke="#1E293B" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Middle Horizontal bar (Selection highlight accent) -->
    <rect x="120" y="78" width="56" height="18" rx="9" fill="url(#selectionGrad)"/>
    <line x1="120" y1="87" x2="168" y2="87" stroke="#0284C7" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Clean Precision Dot / Sub-brand mark -->
  <circle cx="376" cy="132" r="4.5" fill="#94A3B8"/>
  <circle cx="392" cy="132" r="4.5" fill="#94A3B8"/>
</svg>
