<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep clean white to soft arctic gray) -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <!-- CleanFrame Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#87CFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowHeavy" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>

    <filter id="shadowFloat" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0369A1" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle (512x512) -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgGrad2)" stroke="#E2E8F0" stroke-width="2.5" filter="url(#shadowHeavy)"/>

  <!-- Subtle Inner Glass Frame Accent -->
  <rect x="52" y="52" width="408" height="408" rx="84" fill="none" stroke="#F8FAFC" stroke-width="3"/>

  <!-- Outer Floating Window Geometry: The "Frame" -->
  <g transform="translate(96, 96)">
    <!-- Window Body Background -->
    <rect x="0" y="0" width="320" height="320" rx="44" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3" filter="url(#shadowHeavy)"/>

    <!-- Subtle Tint on Upper Header -->
    <path d="M 0,44 C 0,19.7 19.7,0 44,0 L 276,0 C 300.3,0 320,19.7 320,44 L 320,84 L 0,84 Z" fill="#F8FAFC"/>
    <line x1="0" y1="84" x2="320" y2="84" stroke="#E2E8F0" stroke-width="2.5"/>

    <!-- The 3 CleanFrame Window Controls -->
    <!-- Close -->
    <circle cx="44" cy="42" r="9" fill="#EF4444" opacity="0.9"/>
    <!-- Minimize -->
    <circle cx="76" cy="42" r="9" fill="#F59E0B" opacity="0.9"/>
    <!-- Square Maximize (CleanFrame Hallmark icon) -->
    <rect x="100" y="33" width="18" height="18" rx="4" fill="#10B981" opacity="0.9"/>

    <!-- Centerpiece Emblem: Intersecting Minimalist Frame in Sky Blue & Charcoal -->
    <!-- Large Rounded Minimal Frame Corner -->
    <path d="M 90,136 
             L 210,136 
             C 232,136 248,152 248,174 
             L 248,250" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="22" 
          stroke-linecap="round"
          stroke-linejoin="round"
          filter="url(#shadowFloat)"/>

    <!-- Complementary Inverted Frame -->
    <path d="M 230,250 
             L 110,250 
             C 88,250 72,234 72,212 
             L 72,174" 
          fill="none" 
          stroke="#1E293B" 
          stroke-width="22" 
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Selection Pill Indicator (CleanFrame's signature #87CFFF token) -->
    <rect x="116" y="180" width="88" height="26" rx="13" fill="#87CFFF"/>
    <circle cx="132" cy="193" r="5" fill="#0284C7"/>
    <rect x="146" y="190" width="44" height="6" rx="3" fill="#0284C7"/>
  </g>
</svg>
