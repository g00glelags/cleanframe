<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="brandGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <filter id="shadowCard" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Banner Background Card -->
  <rect x="12" y="12" width="936" height="236" rx="36" fill="url(#bannerBg)" stroke="#E2E8F0" stroke-width="2.5" filter="url(#shadowCard)"/>

  <!-- Icon Section (Left) -->
  <g transform="translate(48, 36)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="188" height="188" rx="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2.5" filter="url(#shadowCard)"/>

    <!-- Window Header -->
    <path d="M 0,28 C 0,12.5 12.5,0 28,0 L 160,0 C 175.5,0 188,12.5 188,28 L 188,52 L 0,52 Z" fill="#F8FAFC"/>
    <line x1="0" y1="52" x2="188" y2="52" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Controls -->
    <circle cx="28" cy="26" r="6" fill="#EF4444" opacity="0.9"/>
    <circle cx="48" cy="26" r="6" fill="#F59E0B" opacity="0.9"/>
    <rect x="62" y="20" width="12" height="12" rx="3" fill="#10B981" opacity="0.9"/>

    <!-- Emblem within Icon -->
    <g transform="translate(24, 70)">
      <path d="M 50,14 L 110,14 C 122,14 130,22 130,34 L 130,76" fill="none" stroke="url(#brandGradB)" stroke-width="12" stroke-linecap="round"/>
      <path d="M 120,76 L 60,76 C 48,76 40,68 40,56 L 40,24" fill="none" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
      <rect x="64" y="38" width="46" height="14" rx="7" fill="#87CFFF"/>
    </g>
  </g>

  <!-- Typography Section (Right) -->
  <g transform="translate(280, 72)">
    <!-- Main Title -->
    <text x="0" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#0F172A" letter-spacing="-1.5">
      Clean<tspan fill="#0284C7">Frame</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="4" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#64748B" letter-spacing="0.2">
      A Consistent, Predominantly Light Desktop Theme
    </text>

    <!-- Feature Pills -->
    <g transform="translate(4, 126)">
      <!-- Pill 1: Cinnamon -->
      <rect x="0" y="0" width="124" height="28" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="62" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">CINNAMON</text>

      <!-- Pill 2: GTK 2/3/4 -->
      <rect x="134" y="0" width="112" height="28" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="190" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">GTK+ 2 / 3 / 4</text>

      <!-- Pill 3: Light-Only -->
      <rect x="256" y="0" width="118" height="28" rx="8" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.5"/>
      <text x="315" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">LIGHT-ONLY</text>

      <!-- Pill 4: Zero Leaks -->
      <rect x="384" y="0" width="144" height="28" rx="8" fill="#DCFCE7" stroke="#BBF7D0" stroke-width="1.5"/>
      <text x="456" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">ZERO COLOR LEAKS</text>
    </g>
  </g>
</svg>
