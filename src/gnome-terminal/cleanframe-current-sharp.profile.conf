# GNOME Terminal light palette preset (stored as a selectable profile).
# This preset is palette-first: it preserves fg/bg/cursor, but we override text selection
# highlight to match the CleanFrame app selection color.
# Values are GSettings/GVariant strings where applicable.

VISIBLE_NAME="CleanFrame (Light Palette Only - Vivid)"

USE_THEME_COLORS="false"
APPLY_PALETTE_ONLY="true"
APPLY_HIGHLIGHT_OVERRIDE="true"
HIGHLIGHT_COLORS_SET="true"
HIGHLIGHT_BACKGROUND_COLOR="'rgb(166,228,255)'"
HIGHLIGHT_FOREGROUND_COLOR="'rgb(0,0,0)'"

# Palette derived from the current profile and adjusted for vivid contrast (light theme).
# Slots: black, red, green, yellow, blue, magenta, cyan, white + bright variants
PALETTE="['rgb(0,0,0)', 'rgb(214,22,36)', 'rgb(0,156,86)', 'rgb(176,112,0)', 'rgb(0,92,198)', 'rgb(170,40,198)', 'rgb(0,154,182)', 'rgb(226,226,226)', 'rgb(52,52,52)', 'rgb(255,77,59)', 'rgb(0,196,108)', 'rgb(214,148,0)', 'rgb(0,120,255)', 'rgb(196,74,228)', 'rgb(0,186,220)', 'rgb(255,255,255)']"
