# GNOME Terminal light profile preset (stored as a selectable profile).
# Sets pure white background, black text and CleanFrame selection highlight.
# Values are GSettings/GVariant strings where applicable.

VISIBLE_NAME="CleanFrame Light"

USE_THEME_COLORS="false"
APPLY_PALETTE_ONLY="false"
BACKGROUND_COLOR="'rgb(255,255,255)'"
FOREGROUND_COLOR="'rgb(0,0,0)'"
BOLD_COLOR="'rgb(0,0,0)'"
BOLD_COLOR_SAME_AS_FG="true"
BOLD_IS_BRIGHT="false"
CURSOR_COLORS_SET="true"
CURSOR_BACKGROUND_COLOR="'rgb(0,0,0)'"
CURSOR_FOREGROUND_COLOR="'rgb(255,255,255)'"

APPLY_HIGHLIGHT_OVERRIDE="true"
HIGHLIGHT_COLORS_SET="true"
HIGHLIGHT_BACKGROUND_COLOR="'rgb(166,228,255)'"
